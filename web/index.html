<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F9">
  <title>备考助手</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="no-course">
  <div class="app">
    <aside class="rail" id="rail" aria-label="课程导航"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="view" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="课程步骤"></nav>
    </div>
  </div>
  <aside class="assist" id="assist" hidden aria-label="备考助手"></aside>
  <button class="fab" id="assistFab" type="button" aria-label="打开备考助手">问助手</button>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="layer"></div>
</body>
</html>
